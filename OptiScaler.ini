; Main overlay window size in pixels (saved by "Save Settings")
; float - Default (auto) is 50% of the display width / height
Width=auto
Height=auto

; Side of the screen the main menu is docked to, as ReShade docks its overlay. Dragging the menu's title
; bar onto an edge of the screen docks it there, dragging it out floats it.
; 0 floating (centred until moved), 1 left, 2 right, 5 top, 6 bottom (3 and 4 are read as left and right)
; Default (auto) is 0
Anchor=auto

; Order of the side bar's buttons, their short names comma-separated. Dragging a button up or down sets it.
; A name left out goes after the ones given.
; Default (auto) is NR,UP,FG,IMG,UI,ADV
SectionOrder=auto

; Shortcut key for opening menu
; For all keycode values, you can check this address
; Match Description with key Value
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x2D which equals VK_INSERT/Insert key, previous default key was 0x24 -> VK_HOME/Home key
; If you want to use e.g. VK_BACK/Backspace key, that would be 0x08 - set ShortcutKey=0x08
; -1 -> No shortcut key
;
; Every shortcut key here and DlssNr ToggleKey take a combination too: a key with any of Ctrl, Shift,
; Alt and Tab held, written as text (ShortcutKey=Ctrl+Shift+Home, Alt+F10, Ctrl+0x2D) or as a number
; with the modifiers above the key code: 0x10000 Ctrl, 0x20000 Shift, 0x40000 Alt, 0x80000 Tab
; (0x30024 is Ctrl+Shift+Home; the menu saves this form). Key names: A-Z, 0-9 (after a modifier;
; a number alone is a key code), F1-F24, Numpad0-9,
; Insert, Delete, Home, End, PageUp, PageDown, PrintScreen, Pause, ScrollLock, Space, Enter, Backspace,
; Escape, Tab, Up, Down, Left, Right, NumpadAdd/Subtract/Multiply/Divide/Decimal.
; A key fires only with exactly its modifiers held: Home alone does not fire while Ctrl is held.
ShortcutKey=auto

; Extends Scaling Ratio limits to 0.1 - 6.0
; true or false - Default (auto) is false
ExtendedLimits=auto

; Use High Quality Font for Menu
; Might use more VRAM
; If you see a black overlay or experience menu related crashes with Vulkan, try disabling
; true or false - Default (auto) is true
UseHQFont=auto

; Controls the size of just the font without touching other style elements
; Mostly useful when using custom fonts via TTFFontPath
; float - Default (auto) is 14.0
FontSize=auto

; Path to a font to be used as HQ Font, requires UseHQFont=true
; Best to use monospace fonts
; Example path: C:\\Windows\\Fonts\\comic.ttf
; Default (auto) is Hack-Regular bundled with OptiScaler
TTFFontPath=auto

; Disables Startup Splash message
; true or false - Default (auto) is false
DisableSplash=auto

; Enables FPS overlay
; true or false - Default (auto) is false
ShowFps=auto

; In-game FPS Overlay scale
; 0.5 to 2.0 - Default (auto) is using the same scale as menu
FpsScale=auto

; FPS overlay position
; 0 = Top Left | 1 = Top Right | 2 = Bottom Left | 3 Bottom Right
; 0 to 3 - Default (auto) is 0
FpsOverlayPos=auto

; FPS overlay type
; 0 = Just FPS | 1 = Simple | 2 = Detailed | 3 = Detailed + Graph | 4 Full | 5 Full + Graph | 6 Reflex timings
; 0 to 6 - Default (auto) is 0
FpsOverlayType=auto

; Shortcut key for FPS overlay
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x21 -> VK_PRIOR/Page up key
; -1 -> No shortcut key
FpsShortcutKey=auto

; Shortcut key for FPS overlay type cycle
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x22 -> VK_NEXT/Page down key 
; -1 -> No shortcut key
FpsCycleShortcutKey=auto

; Enables Horizontal FPS overlay layout
; true or false - Default (auto) is false
FpsOverlayHorizontal=auto

; FPS Overlay background alpha
; 0.0 to 1.0 - Default (auto) is 0.4
FpsOverlayAlpha=auto

; Shortcut key for FG enabled/disabled
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x23 -> VK_END/End key
; -1 -> No shortcut key
FGShortcutKey=auto

; Screenshot key: saves the frame as it is presented (NR included) without OptiScaler's menu, FPS
; overlay or notices, as "<exe name> <date> <time>.png". With an HDR swapchain (HDR10 or scRGB) it also
; saves a .jxr with the full HDR image; the .png is then mapped to SDR (203 nits as white).
; Integer value or combination (see ShortcutKey) - Default (auto) is 0x75 -> VK_F6/F6 key
; PrintScreen (0x2C) works too. -1 -> No shortcut key
ScreenshotKey=auto

; Folder for screenshots, absolute or relative to the game exe folder. The menu's Keybinds section
