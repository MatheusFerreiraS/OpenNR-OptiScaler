; DXGI_FORMAT_R10G10B10A2_UNORM instead of DXGI_FORMAT_R16G16B16A16_FLOAT
; true or false - Default (auto) is false
UseHDR10=auto

; Skip setting HDR colorspace 
; true or false - Default (auto) is false
SkipColorSpace=auto



; -------------------------------------------------------
[V-Sync]
; -------------------------------------------------------
; Enable V-Sync controls
; true or false - Default (auto) is false
OverrideVsync=auto

; Force V-Sync value
; true or false - Default (auto) is none selected
ForceVsync=auto

; Sync interval value for V-Sync
; 0 to 3 - Default (auto) is none selected
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; Override max Anisotropy/Anisotropic Filtering for textures
; 2, 4, 8, 16 - Default (auto) is disabled
AnisotropyOverride=auto

; Change comparison filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyComparison=auto

; Change min/max filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyMinMax=auto

; Skip overriding on point filters
; true or false - Default (auto) is true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; Override value for Mipmap LOD bias
; -15.0 - 15.0 - Default (auto) is disabled
MipmapBiasOverride=auto

; Use a fixed value for LOD bias 
; true or false - Default (auto) is false
MipmapBiasFixedOverride=auto

; Use override value as scale multiplier 
; true or false - Default (auto) is false
MipmapBiasScaleOverride=auto

; Override all textures LOD bias (normally only overriding < 0 values)
; true or false - Default (auto) is false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; Only inject into this specific process (case-insensitive)
; Example: TargetProcessName=endfield.exe
; Default (auto) is disabled (injects into all processes)
TargetProcessName=auto

; Don't inject into this specific process (case-insensitive)
; Process names seperated with pipe "|" - Default (auto) is 
; crashpad_handler.exe and others - listed in Config.h under ProcessFilter
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; Enables checking for latest version from Github
; true or false - Default (auto) is true
CheckForUpdate=auto

; Enables blocking of Steam and Epic overlays
; Also blocks Steam Input
; true or false - Default (auto) is false, except for OptiFG when true
DisableOverlays=auto

; Use manual input polling instead of hooking WndProc
; Might help games which does not capture inputs properly
; As a downside it will not be able to block inputs when menu is open
; true or false - Default (auto) is false
ManualInputPolling=auto

; Simulate waitable object event signals for FG swapchain
; true or false - Default (auto) is false
SimulateWaitableObject=auto

; OptiScaler will delay loading of Reshade and create D3D12 device first
; This option will prevent warnings/crashes with Luma and some other ReShade mods
; When using Luma mod and this will be enabled
; true or false - Default (auto) is false
CreateD3D12DeviceForLuma=auto

; OptiScaler will try to force High Performance GPU
; true or false - Default (auto) is false
PreferDedicatedGpu=auto

; OptiScaler will report only first High Performance GPU
; true or false - Default (auto) is false
PreferFirstDedicatedGpu=auto

; Rounds internal resolutions width and height to multiple of this value
; 2, 4, 8, 16 ...  - Default (auto) is disabled
RoundInternalResolution=auto

; Skips upscaling of n frames
; n is integer number  - Default (auto) is disabled
SkipFirstFrames=auto

; Restore last used compute signature after upscaling
; true or false - Default (auto) is false
RestoreComputeSignature=auto

; Restore last used graphics signature after upscaling
; true or false - Default (auto) is false
RestoreGraphicSignature=auto

; Tries to track signature changes to fully restore them
; Useful for games using bindless
; true or false - Default (auto) is false
ExtendedStateRestore=auto

; Use precompiled shaders for RCAS, Output Scaling and Mask Bias
; true or false - Default (auto) is true
UsePrecompiledShaders=auto

; Color texture resource state to fix for rainbow colors on AMD cards (for mostly UE games) 
; For UE engine games on AMD, set Color to 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier=auto
; For UE engine games on AMD, set MotionVector to 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; Default (auto) is state correction disabled
; These settings defines each resources initial resource 
; state and add resource barrier for correct state
;
; Common resource barrier states
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; All state values can be checked from here
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states

[DlssNr]
; Optional colour-based final-edit filter (not NVIDIA's semantic AutoMask).
; Warm scenery may match; coloured lighting may hide skin. Preview before relying on it.
; Controls apply once to the combined output of all model passes. 0..1 attenuates the edit.
SkinProtection=false
SkinToneEnabled=true
SkinDetail=1.0
SkinColour=1.0
EnvironmentDetail=1.0
EnvironmentColour=1.0
ShowSkinMask=false

; The "NR ON" badge in a corner of the frame while Neural Rendering runs, so a screenshot or a video
; says it was on. Turns on and off in the menu without a restart.
; true or false - Default (auto) is false
Badge=auto
; 0 top left, 1 top right, 2 bottom left, 3 bottom right - Default (auto) is 1
BadgeCorner=auto
; Size, 0.5 to 3.0 - Default (auto) is 1.0
BadgeScale=auto

; Key that switches Neural Rendering on and off in game. With Num Lock off, Numpad 5 sends a
; different code (0x0C) and does nothing.
; Integer key code or combination (see [Menu] ShortcutKey) - Default (auto) is 0x65 -> VK_NUMPAD5;
; -1 -> No shortcut key
ToggleKey=auto
; DLSS 5 Neural Rendering. Synthesises detail in the upscaler's output, before frame generation sees it.
;
; Needs nvngx_dlssnr.dll 310.8 placed beside OptiScaler or the game executable, plus
; nvngx.dll_dlssnr.dll from this package. RTX 50 uses the original NVIDIA runtime. RTX 20/30/40 needs
; ShortFuse's cross-generation compatibility runtime from the pinned RenoDX thread; see
; INSTALL-DLSSNR.md for its SHA-256. The snippet refuses callers whose module path does not contain
; "nvngx.dll", which is the only reason that second file exists.
;
; Undocumented and driven directly, so none of it is officially supported.
; true or false - Default (auto) is false
Enabled=auto

; AMD final-image NR for D3D9, D3D11, D3D12 and Vulkan games without an upscaler, and for OpenGL
; games with OptiScaler installed as opengl32.dll. Runs the danielblnc runtime on the swapchain
; image, HUD included, with FidelityFX Optical Flow for motion; lmxxf and mochizuki ignore it.
; Vulkan needs it on before the game creates its swapchain. Leave it off in games that have an
; upscaler: while it is on, OptiFG (FGInput=upscaler) runs only with XeFG output.
; XeFG (FGOutput=xefg) uses the optical-flow guides. With NR turned off in game, D3D9, D3D11, D3D12 and
; Vulkan keep generating frames from the guides alone; OpenGL stops frame generation until NR is back.
; Back buffers other than 8-bit RGBA or BGRA (10-bit, FP16, HDR) get neither NR nor XeFG.
; true or false - Default (auto) is false; enable both this and Enabled above to try it.
PresentWithoutUpscaler=auto

; Run Neural Rendering over the colour input immediately before Super Resolution, at render
; resolution. Ray Reconstruction remains on the supported post-upscale path. false preserves the
; normal v0.2.0 placement. Origin-zero padded inputs use their active render size.
; Non-zero colour offsets or invalid active rectangles safely fall back post-upscale.
; NVIDIA backend only: the AMD backend takes its placement from ApplyAfterRR below.
; true or false - Default (auto) is false
RunBeforeSR=auto

; D3D12 and its bridges: run the neural pass over the frame Ray Reconstruction finished, instead of
; over the upscaler's input. RR denoises and upscales first; the model then edits its output. This
; never enables RR in a game that does not already have it.
;
; This is also the placement to use with FSR-RR and the AMD neural backend. FSR-RR's denoise and its
; enlargement are a single dispatch and cannot be split, so pre-SR has nothing to attach to -- with
; this off, the AMD model declines every frame that reaches it after Ray Reconstruction.
;
; On the AMD backend this key alone chooses where the model runs, on every title (Ins menu:
; "Processing point"): false runs it before Super Resolution, true after the finished frame.
; RunBeforeSR is not consulted there.
;
; RRWorkingScale is relative to RR's OUTPUT: 1.0 runs the model over every pixel of the finished
; frame, 0.5 at 4K runs it at 1920x1080 and enlarges the answer back. Cost falls with the square of
; it. The AMD runtime does not supersample, so it stops at 1.0 there; the NVIDIA backend accepts up
; to 2.0. RRPasses follows the same ceiling as Passes above.
;
; Changing the placement rebuilds the model's history, so expect a few frames of warm-up.
; Defaults: false, one pass, 1.0 of RR output width/height (every pixel of the finished frame).
ApplyAfterRR=auto
RRPasses=auto
RRWorkingScale=auto

; How far the frame moves toward the model's picture. Its answer is not added to the frame: it is a
; complete picture, rescaled so its luminance sits where the original says it should, and this blends
; between the two. 0 gives back exactly what the upscaler produced, 1 is the model's picture, and above
; 1 carries on past it.
; Default (auto) is 1.0
TransferStrength=auto

; Whether the model's colour arrives with its light. 0 keeps the game's own hue exactly and lets only
; brightness carry the model's verdict; 1 brings the model's colour as well, in its own hue.
; Default (auto) is 1.0
ColourStrength=auto

; The linear value the encode maps to display white, which belongs to the game's exposure rather than to
; any fixed number: measured frame means in one game ranged from 0.065 to 185. Left automatic, it is
; measured from the frame. This does move the result, not only what the model is shown: the picture the
; model was given is one of the luminances the composition weighs. Applies only to a linear buffer; a
; frame the game reports as already tone-mapped is passed over untouched.
; true or false - Default (auto) is true
; Multiplies the white point above before the model sees the frame -- the paper-white control.
; Default (auto) is 1.0
WhitePointScale=auto

; The most the pass may brighten any pixel, as a multiple of what it already was. Darkening is not
; capped. Guards against the model turning a bright light into a string of coloured cells.
;
; The guard is applied once, to the finished composition, while Passes compounds the ratio it bounds.
; A value near the pass count keeps the headroom each pass gets roughly constant -- 1 pass at 1.0,
; 2 at 2.0, 3 at 3.0. Left at the default the third pass spends most of its contribution against the
; clamp.
; Default (auto) is 2.0
MaxRatio=auto

; What fraction of the frame the model works at. The frame itself is never reduced -- only the model's
; own work is done small and enlarged. Cost falls with the square of this. Above 1.0 (DX12 & Vulkan)
; the model supersamples: it runs above native and the answer is averaged back down.
; Default (auto) is 1.0
WorkingScale=auto

; Run the model before the upscaler rather than after it.
;
; The model is shown the game's colour buffer at render resolution, so at Performance it costs about a
; quarter of what it costs after the upscaler, and it sees rendered pixels rather than reconstructed
; ones. Unlike WorkingScale the model still runs 1:1 -- it is given a smaller frame instead of a
; reduced view of a large one -- so its fine structure is not softened before the upscaler sees it.
;
; Experimental. Colour at this seam is jittered by a different subpixel offset every frame and the
; model takes no jitter offset, so its history may reproject against an offset it cannot see. Watch
; for shimmer and swimming on fine detail under camera motion.
; Default (auto) is false
PreUpscale=auto

; Split the upscaler in two and run the model between the halves.
;
; The upscaler is built to write at render resolution, the model runs on that, and the enlargement to
; display resolution happens after it. With ray reconstruction this makes the first half a denoiser and
; nothing else -- the frame the model is shown is clean, temporally settled, and a quarter of the pixels
; at Performance.
;
; This is the answer to PreUpscale's jitter problem: the frame here has already been through temporal
; accumulation, so the subpixel offset the model takes no parameter for is resolved before it looks.
;
; The enlargement is the output scaler rather than the upscaler's own. Read at feature build time, so a
; change takes effect on the next restart or quality change. Does nothing at DLAA, where render
; resolution already equals display resolution and there is no smaller frame to run on.
; Default (auto) is false
DualFeature=auto

; Which upscaler enlarges the frame after the model, in the arrangement above.
;
; Takes the same names as Dx12Upscaler -- dlss, fsr22, fsr31, ffx, xess -- and resolves through the same
; provider, so asking for dlss on a machine without it is handed fsr exactly as it would be anywhere
; else in OptiScaler.
;
; auto uses the spatial output scaler instead. That one needs no motion vectors, no depth and no jitter,
; so it is the only choice that cannot be wrong about them; it is also the softest, having no temporal
; information to work from. The upscalers are sharper and inherit the game's own per-frame data.
; Default (auto) is the spatial output scaler
DualEnlarger=auto

; How many times the model runs over the frame, each pass shown the last one's answer. Cost is exactly
; linear -- five passes is five model runs -- and each pass is its own model with its own memory, so
; VRAM grows with the count and raising it takes a couple of seconds to arrive. 1 to 5.
; Default (auto) is 1
Passes=auto
; The downscaler that averages the model's answer back to native when WorkingScale is above 1.0
; (supersampling). Independent of OutputScaling/Downscaler, so the two can differ. 0 FSR1, 1 Bicubic,
; 2 CatmullRom, 3 Lanczos2, 4 Lanczos3, 5 Kaiser2, 6 Kaiser3, 7 MAGIC.
; Default (auto) is 4 (Lanczos3)
ScalingDownscaler=auto

; 0 off, 1 the picture the model sees, 2 its raw answer, 3 what it changed amplified twenty times.
; A flat grey difference view means the model is doing nothing.
; Default (auto) is 0
DebugView=auto

; Writes matched before/after frames to a dlssnr-capture folder beside OptiScaler when the pass first
; runs. Bounded to eight frames, and each run overwrites the last.
; true or false - Default (auto) is true
AutoCapture=auto

; Model controls. Preset and Style are baked into each feature, so changing them causes a guarded
; feature rebuild after the current GPU work retires. The values are undocumented, and the preset
; scale is not the same one Super Resolution or Ray Reconstruction uses.
; Default (auto) is 0
Preset=auto
Style=auto

; Passes 2 and 3 inherit the pass 1 Preset/Style above when left on auto. Set an override to use a
; different built-in model profile for that layer: preset 0..3; style 0 standard, 1 natural,
; 2 cinematic. These select profiles inside the same NVIDIA model DLL, not different model files.
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; Per-pass model strengths (DX12 multipass, including NR after RR).
; Auto inherits pass 1, except LocalTone: auto keeps the legacy later-pass value 0.
; Intensity/LocalStructure/LocalTone: 0..2; SkinStructure: -1..2 (-1 follows structure).
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; Default (auto) is 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 means follow local structure, which is the model's own default, not a strength of zero.
; Default (auto) is -1.0
SkinStructure=auto
; true or false - Default (auto) is true
AutoMask=auto

; Per-pass model settings
;
; Everything the model is told except the preset is an evaluate argument, so a later pass can be
; driven differently from the first at no cost. The preset is latched when a pass's feature is built,
; so changing one rebuilds that pass alone.
;
; Sparse: "2:intensity=0.5,style=1;3:intensity=0.3". Passes are numbered from 1, and a pass with no
; entry uses the values above it, so leaving this empty is what the chain did before it existed.
; Keys: intensity, structure, tone, skin, style, preset, mask.
;
; The passes compound -- a later pass sees what the one before produced -- so easing intensity down
; the chain keeps the last passes refining rather than re-amplifying.
; Default (auto) is empty
PassOverrides=auto

; Lift the ceiling on Passes
;
; Passes stops at 5 unless this is set, after which the slider reaches 30. Cost is exactly linear and
; the model is nearly all of it, so ten passes is ten model runs in one frame; each also holds an NGX
; feature with its own history, sized by the driver. They are built one at a time with a settle
; between, so a large count takes a while to reach and the frames spent building show nothing.
;
; Turning this off clamps Passes back to 5.
; true or false - Default (auto) is false
UnlockPasses=auto

; --------------------------------------------------------------------------------------------------
; AMD neural rendering bridge (pre-SR). Runs the neural pass on an AMD GPU through the danielblnc
; DLSS-NR-on-AMD runtime; super-resolution stays FFX/FSR. These keys are read from this section and
; are also on the Ins menu. Everything here defaults to a working configuration -- set a key only to
; move away from it.
; --------------------------------------------------------------------------------------------------

; Disable temporal stabilization (Ins menu, under "Enable NR"). false keeps the model's temporal
; history, building each frame on the ones before it, which steadies the image. true processes
; every frame on its own: less ghosting, more flicker and shimmer. With AmdSlots=1, true also makes
; the render thread wait for the model after every frame; with more slots that wait is skipped
; except during a native rebuild. The key keeps its original name so existing INIs still work.
; true or false - Default (auto) is false
AmdEveryFrame=auto

; Fixed noise seed (Ins menu, beside it). danielblnc's runtime draws new noise every frame; with its temporal
; history that shows as flicker under an upscaler. true sets the seed back every frame, as the ReShade add-on and
; NR without upscaling do. danielblnc 0.4.1 to 0.6.0.
; true or false - Default (auto) is true
AmdFixedSeed=auto

; How many frames may have a denoise in flight at once. One buffer is held per running denoise, and a
; frame that finds every slot busy is recorded with no denoise at all -- so this decides whether
; every-frame NR works, more than how fast it runs. 1 to 5 here; the menu offers 2 to 5.
; Default (auto) is 3
AmdSlots=auto

; How the picture wait is taken. 1 requests the runtime's 1-pixel-draw wait, and is asked for only
; when this frame's D3D12 state can be frozen and restored; otherwise the path falls back on its own.
; 0 is the original wait. Switchable in game from Ins -> New wait mode; if that mode misbehaves and
; you cannot reach the menu, close the game and set this to 0.
; 0 or 1 - Default (auto) is 1
AmdGraphicsWait=auto

; One danielblnc job the GPU holds for this many milliseconds switches NR off; switch it on again to retry.
; On an RX 9060 XT single jobs were seen to take about 4 s every few minutes, freezing the game for
; those seconds, and two close together locked the whole PC. The mochizuki runtime does not use HIP.
; 0 turns this off.
; Default (auto) is 2000
AmdStallStandDownMs=auto

; danielblnc's runtime async: the game's queue does not wait for the network every frame, and the result
; lands one frame later. danielblnc traces the freezes some players met to those waits. It runs after the
; finished frame (a correction one frame late would build up in the upscaler's history) with one pass.
; Read when the game starts.
; true or false - Default (auto) is false
AmdAsync=auto

; danielblnc 0.8.0 (NeuralHub's host): where its kernels run. Its DLSS-FG runs on D3D12 only, and its NR, as
; OptiScaler drives it, on HIP only, so the two cannot run together. auto picks D3D12 when an nvngx_dlssg.dll sits
; beside the host, in the OptiScaler folder or in the game's folder (many games ship one), HIP otherwise. HIP keeps
; danielblnc's NR running in those games, without NeuralHub's DLSS-FG. Read when the game starts.
; auto, HIP or D3D12 - Default (auto)
HostComputeBackend=auto

; danielblnc 0.8.0 on HIP: true shares the game's textures with HIP and runs the network inline on the game's queue;
; false copies the inputs and runs it asynchronously. Read when the game starts.
; true or false - Default (auto) is true
HostZeroCopy=auto

; Request the 1-pixel draw even when the freeze or admission check failed. There is no complete D3D12
; graphics-state restore behind it, so the game's command list can be left dirty. Experimental.
; 0 or 1 - Default (auto) is 0
AmdGraphicsUnsafe=auto

; Legacy key. The spin draw is driven by AmdGraphicsWait above; this is kept only so old ini files
; still load.
; Default (auto) is 0
AmdSpinDraw=auto

; What fraction of the frame the AMD model works at, the pre-SR counterpart of WorkingScale.
; Default (auto) is 1.0
AmdModelScale=auto

; Dynamic NR resolution. While the rendered frame rate stays under AmdDynamicTargetFps, the model's
; resolution steps down from the one set above (AmdModelScale before Super Resolution, RRWorkingScale
; after the finished frame) through 85%, 70%, 55% and 40% of it, never below 25% of the frame.
; It steps down after 2 s under the target and back up after 5 s with 15% headroom, waits 10 s after
; every change, and waits 60 s after a step down before trying to go back up. Each change rebuilds
; the model, so the effect is off for one to five seconds and its history restarts. A step that
; the 25% floor would shrink by less than 10% is skipped. The AMD runtime keeps
; a little more VRAM after every rebuild, so it makes at most 8 changes per session and then stays
; where it is; turning it off and on again resets the count. With a frame cap,
; set the target a little below the cap, or it never sees the headroom to step back up.
; Defaults (auto): false, 60
AmdDynamicScale=auto
AmdDynamicTargetFps=auto

; How the colour handed to the AMD runtime is encoded: 1 Linear, 2 sRGB, 3 Gamma 2.2.
; 1 hands it over unchanged, as danielblnc's own runtime does; 2 and 3 decode the frame to linear
; light before the model and encode its answer back afterwards, which weakens its colour and
; lighting. 0, the former Auto, is read as Linear.
; Default (auto) is 1 (Linear)
AmdEncoding=auto

; How much of the network's result reaches the frame, 0.0 to 2.0. 1.0 is the AMD runtime's own
; default; 0.0 leaves the frame as the game drew it. Needs the danielblnc runtime 0.3.1 or later.
; With RenoComposition on it is the composition's intensity on danielblnc (in place of RenoIntensity)
; and the runtime keeps its default. The final image (PresentWithoutUpscaler) has no composition, so
; there it is always the runtime's strength.
; Default (auto) is 1.0
AmdEffectStrength=auto

; lmxxf: give the model a white point measured from the frame's mean brightness instead of a fixed
; one, for games that hand very dark linear colour (KCD2 at night) where the model shows grain or a
; green tint. Measured anew every frame.
; true or false - Default (auto) is false
LmxxfAutoExposure=auto

; Stabilizer after the NR runtime, before SR: smooths small frame-to-frame changes of the neural effect along the
; game's motion vectors. Changes larger than the threshold (in 1/255) pass through. Strength 0 turns it off.
; AmdStabilizer* applies to danielblnc and MochizukiStabilizer* to mochizuki; lmxxf has its own smoothing.
; Strength 0.0 to 1.0, threshold 0.5 to 8.
; Default (auto) is 0 strength and 2 threshold with an upscaler, or 0.8 and 4 in final-image mode.
AmdStabilizerStrength=auto
AmdStabilizerThreshold=auto
MochizukiStabilizerStrength=auto
MochizukiStabilizerThreshold=auto

; RenoDX composition, after the NR runtime (and the stabilizer), before SR, on every runtime: the
; network's change goes back on the game's own picture as a gain bounded in log2 (brightness by
; RenoGuard, a multiple either way; colour RenoChromaClamp stops), the way RenoDX's DLSS Neural
; Rendering add-on composes. RenoIntensity weighs the change (0 = the game's picture; above 1 the
; brightness change is pushed further inside the guard; on danielblnc AmdEffectStrength takes its place). RenoColour 0 keeps the game's colour at the
; network's brightness, 1 the network's colour change. RenoPedestal takes off the lift the network adds
; in near-black areas.
; Default (auto) is RenoComposition=false, RenoIntensity=1 (0-2), RenoGuard=2 (1-8), RenoColour=1,
; RenoChromaClamp=1 (0.25-2), RenoPedestal=false
RenoComposition=auto
RenoIntensity=auto
RenoGuard=auto
RenoColour=auto
RenoChromaClamp=auto
RenoPedestal=auto

; Person protection (experimental), lmxxf and mochizuki before SR: a person
; mask made on the CPU by person-model\person-worker.exe (beside OptiScaler; the models and ONNX
; Runtime come with the installer) keeps the first pass's result on people with two or more passes,
; the last pass's elsewhere. Where the mask is missing or late, or motion and depth are unusable, the
; frame keeps NR as it is. NrPersonModel: 0 PP-HumanSeg, 1 YOLO11n-seg, 2 YuNet (faces only, at
; NrFaceInputSize 320, 384, 416 or 448). NrPersonStrength and NrPersonDetailGain (0-1): how much of
; NR's change, and of its fine detail, reaches people; below 1 they act in single pass too.
; NrPersonDebugMask tints the mask green and logs it every two seconds.
; Default (auto) is NrPersonPartition=false, NrPersonModel=0, NrFaceInputSize=320,
; NrPersonStrength=1, NrPersonDetailGain=1, NrPersonDebugMask=false
NrPersonPartition=auto
NrPersonModel=auto
NrFaceInputSize=auto
NrPersonStrength=auto
NrPersonDetailGain=auto
NrPersonDebugMask=auto

; How the danielblnc runtime does its arithmetic: 0 = fast (cheaper arithmetic where the difference
; is barely visible, about 13% faster, RX 9000 only), 1 = quality (NVIDIA's own arithmetic).
; Needs the danielblnc runtime 0.4.2 or later. Can change while the game runs.
; Default (auto) is 0
AmdQuality=auto

; The display curve the danielblnc runtime shows the network the frame through: 0 = Reinhard (soft),
; 1 = ACES (filmic). Needs the danielblnc runtime 0.4.0 or later. Changing it restarts the model's
; history.
; Default (auto) is 0
AmdToneCurve=auto

; danielblnc's own Black lift (ToneLift): lifts the darkest tones on the tone curve, 0.0 to 0.25, and
; its exposure source: true = the exposure the game hands the upscaler, when it does; false = the
; runtime's own auto-exposure. Needs the danielblnc runtime 0.4.0 or later. Changing either restarts
; the model's history.
; Default (auto) is 0.0 and true
AmdToneLift=auto
AmdUseGameExposure=auto

; danielblnc's Style, the look the network is asked for: 0 = Standard, 1 = Natural, 2 = Cinematic.
; Needs the danielblnc runtime 0.4.0 or later. Changing it restarts the model's history.
; Default (auto) is 0
AmdStyle=auto

; Neural lighting, and how far the frame moves toward it.
; Default (auto) is true / 0.5
AmdNeuralLighting=auto
AmdNeuralLightingStrength=auto

[AmdRtgi]
; Native ray-traced global illumination from the AMD runtime. Off by default; the quality, denoiser,
; radius, thickness, fade and the rest are driven from the Ins menu and written back here once
; touched, so this section fills itself in as you use it.
; true or false - Default (auto) is false
Enabled=auto

[AmdLook]
; Post-pass appearance controls (material detail, shape definition, local lighting, skin). Off by
; default; the individual controls live on the Ins menu and are written back here once touched.
; true or false - Default (auto) is false
Enabled=auto

[FSR-RR]
; FidelityFX denoiser used as the Ray Reconstruction provider -- the AMD-native alternative to running
; the neural model. Signal types, floor filter, responsivity and debug views are driven from the Ins
; menu and written back here once touched.
;
; Which denoiser provides RR. 0 leaves RR alone; a non-zero index selects the FFX denoiser.
; Default (auto) is 0
ProviderIndex=auto

; Prefer the Streamline-tagged NormalRoughness buffer for normals and packed roughness when the
; title publishes no separate NGX roughness and the NGX normals binding has no alpha wide enough to
; carry it (R10G10B10A2's two bits read back as roughness 0 across the whole frame). A title that
; supplies roughness properly keeps the binding it declared.
;
; Off by default and never yet observed to fire: it was written for a case that turned out to be an
; external mod zeroing the title's ray-tracing buffers, not a wrong binding. Left in reach for a
; title that genuinely publishes a normals texture with no room for roughness.
; true or false - Default (auto) is false
TaggedNormalRoughness=auto
